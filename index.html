<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>متجر فك الاحتكار</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --btn-bg: #0284c7;
    }
    body {
      margin: 0;
      padding: 16px;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      box-sizing: border-box;
    }
    header {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 1.3rem;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .search-box {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid #334155;
      background-color: var(--card-bg);
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }
    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      scrollbar-width: none;
    }
    .cat-badge {
      background-color: #334155;
      color: var(--text-sub);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      white-space: nowrap;
      cursor: pointer;
    }
    .cat-badge.active {
      background-color: var(--accent);
      color: #0f172a;
      font-weight: bold;
    }
    .app-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }
    .app-card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2);
    }
    .app-icon {
      width: 55px;
      height: 55px;
      border-radius: 12px;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      flex-shrink: 0;
    }
    .app-info {
      flex: 1;
      min-width: 0;
    }
    .app-title {
      margin: 0 0 4px;
      font-size: 1rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .app-meta {
      font-size: 0.8rem;
      color: var(--text-sub);
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .dl-btn {
      background-color: var(--btn-bg);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      flex-shrink: 0;
    }
    .loader {
      text-align: center;
      padding: 40px;
      color: var(--text-sub);
    }
  </style>
</head>
<body>

  <header>
    <h1>🛍️ متجر فك الاحتكار</h1>
    <input type="text" id="search" class="search-box" placeholder="ابحث عن تطبيق...">
    <div class="categories" id="cats-container">
      <div class="cat-badge active" onclick="filterCat('all')">الكل</div>
    </div>
  </header>

  <div id="loader" class="loader">جاري تحميل التطبيقات المعتمدة...</div>
  <div class="app-grid" id="apps-container"></div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      tg.ready();
    }

    const FIREBASE_URL = "https://telegram-appstore-8cac3-default-rtdb.firebaseio.com/apps.json";
    let allApps = [];
    let currentCat = 'all';

    async function loadApps() {
      try {
        const res = await fetch(FIREBASE_URL);
        const data = await res.json();
        document.getElementById('loader').style.display = 'none';

        if (!data) return;

        allApps = Object.entries(data)
          .filter(([_, app]) => app.status === 'approved')
          .map(([id, app]) => ({ id, ...app }));

        buildCategories();
        renderApps();
      } catch (err) {
        document.getElementById('loader').innerText = "حدث خطأ أثناء تحميل البيانات.";
      }
    }

    function buildCategories() {
      const cats = ['الكل', ...new Set(allApps.map(a => a.category).filter(Boolean))];
      const container = document.getElementById('cats-container');
      container.innerHTML = cats.map(c => `
        <div class="cat-badge ${c === 'الكل' ? 'active' : ''}" onclick="filterCat('${c}')">${c}</div>
      `).join('');
    }

    function filterCat(cat) {
      currentCat = cat;
      document.querySelectorAll('.cat-badge').forEach(el => {
        el.classList.toggle('active', el.innerText === cat);
      });
      renderApps();
    }

    function renderApps() {
      const q = document.getElementById('search').value.toLowerCase();
      const container = document.getElementById('apps-container');

      const filtered = allApps.filter(app => {
        const matchCat = (currentCat === 'الكل' || app.category === currentCat);
        const matchSearch = app.name.toLowerCase().includes(q) || (app.description && app.description.toLowerCase().includes(q));
        return matchCat && matchSearch;
      });

      if (!filtered.length) {
        container.innerHTML = '<div class="loader">لا توجد تطبيقات متوفرة.</div>';
        return;
      }

      container.innerHTML = filtered.map(app => `
        <div class="app-card">
          <div class="app-icon">📱</div>
          <div class="app-info">
            <h3 class="app-title">${app.name}</h3>
            <div class="app-meta">
              <span>📁 ${app.category || 'أدوات'}</span>
              <span>⭐ ${app.ratings && app.ratings.count ? (app.ratings.sum / app.ratings.count).toFixed(1) : 'جديد'}</span>
            </div>
          </div>
          <button class="dl-btn" onclick="openApp('${app.id}')">عرض</button>
        </div>
      `).join('');
    }

    function openApp(appId) {
      if (tg) {
        tg.sendData(JSON.stringify({ action: "view", app_id: appId }));
      }
    }

    document.getElementById('search').addEventListener('input', renderApps);
    loadApps();
  </script>
</body>
</html>
